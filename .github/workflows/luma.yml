# Pulls LUMA Basketball Research snapshots (in-season ARC, LOKI releases, players) into data/luma/ with the LUMA_KEY
# secret. Daily just after LUMA's row budget resets (00:00 UTC) and from the Actions tab. Resumable: the history
# fills in over several days at 2,500 rows a day (free key).
name: Pull LUMA data

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First season (year it ends)"
        default: "2014"
  push:                     # also when the pull code changes
    branches: [claude/gifted-turing-3c08ve]
    paths:
      - "nba/luma.py"
      - ".github/workflows/luma.yml"
  schedule:
    - cron: "11 0 * * *"      # daily, just after LUMA's 00:00 UTC reset

permissions:
  contents: write

concurrency:
  group: luma-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Pull
        env:
          LUMA_KEY: ${{ secrets.LUMA_KEY }}
        run: python -m nba.luma pull --start "${{ github.event.inputs.start || '2014' }}" --end 2027
      - name: Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/luma
          git add -A data/luma
          git diff --cached --quiet || git commit -m "LUMA data pull ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          ok=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          [ "$ok" = 1 ]
